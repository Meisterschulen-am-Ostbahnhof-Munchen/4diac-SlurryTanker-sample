name: Release nach .lib-Sync

# Liegt im Ziel-Repo (kommt per .lib-Sync aus
# training1/internal-scripts/sync_lib/target-repo/ dorthin).
# Wird ein PR vom Branch sync-lib/<tag> gemergt, legt dieser Workflow das
# Release <tag> an - mit demselben Namen wie in 4diac_training1.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'sync-lib/')
    runs-on: ubuntu-24.04
    steps:
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          TAG="${HEAD_REF#sync-lib/}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+[a-z]?$ ]]; then
            echo "Ungültiger Tag: $TAG"
            exit 1
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits"
            exit 0
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$MERGE_SHA" \
            --title "Bibliotheken aus 4diac_training1 $TAG" \
            --notes "Stand der Bibliotheken (.lib samt ELFs) aus 4diac_training1 $TAG. Passende Firmware: siehe Release $TAG in 4diac_training1." \
            --latest=false
